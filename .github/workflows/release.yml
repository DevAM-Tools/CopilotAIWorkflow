name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CI: true

jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build CopilotAIWorkflow.slnx -c Release
      - run: dotnet build samples/CSharpStyleValidator.Demo/CSharpStyleValidator.Demo.csproj -c Release -p:UseNuGetPackage=true
      - name: Verify packed analyzer reports violations
        run: |
          if dotnet build samples/CSharpStyleValidator.Demo/CSharpStyleValidator.Demo.csproj -c Release -p:UseNuGetPackage=true -p:IncludeViolations=true; then
            echo "Expected build to fail with analyzer errors."
            exit 1
          fi
      - run: dotnet test CopilotAIWorkflow.slnx -c Release --no-build
      - name: Exit-gate dogfood (coveragegap run)
        run: dotnet run --project src/CoverageGap.Tool/CoverageGap.Tool.csproj -c Release --no-build -- run --repo-root .
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  publish:
    needs: verify-and-pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
      - run: dotnet nuget push artifacts/*.snupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
