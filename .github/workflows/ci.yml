name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build CopilotAIWorkflow.slnx -c Release
      - run: dotnet build samples/CSharpStyleValidator.Demo/CSharpStyleValidator.Demo.csproj -c Release -p:UseNuGetPackage=true
      - name: Verify packed analyzer reports violations
        run: |
          if dotnet build samples/CSharpStyleValidator.Demo/CSharpStyleValidator.Demo.csproj -c Release -p:UseNuGetPackage=true -p:IncludeViolations=true; then
            echo "Expected build to fail with analyzer errors."
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: windows-latest
          - os: windows-11-arm
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build CopilotAIWorkflow.slnx -c Release
      - name: Unit tests (TUnit)
        run: dotnet test CopilotAIWorkflow.slnx -c Release --no-build
      - name: Exit-gate dogfood (coveragegap run)
        run: dotnet run --project src/CoverageGap.Tool/CoverageGap.Tool.csproj -c Release --no-build -- run --repo-root .
