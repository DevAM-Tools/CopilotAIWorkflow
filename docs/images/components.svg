<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img">
  <title>Components of CopilotAIWorkflow and who may depend on whom</title>
  <desc>Top row, components nothing depends on: Tool pointers, CSharpStyleChecker, ExitPointGaps, ReqTrace.
    Bottom row, components without dependencies: Workflow kit, ExitPoints, InvariantStringHelper.
    Arrows: Tool pointers to Workflow kit; CSharpStyleChecker to ExitPoints; ExitPointGaps to ExitPoints and to
    InvariantStringHelper; ReqTrace to InvariantStringHelper.</desc>
  <style>
    :root { --box: #e8eefc; --line: #2b4a9a; --text: #101828; }
    @media (prefers-color-scheme: dark) { :root { --box: #1d2740; --line: #8fb0ff; --text: #e6ebf5; } }
    .node { fill: var(--box); stroke: var(--line); stroke-width: 2; }
    .edge { stroke: var(--line); stroke-width: 2; marker-end: url(#arrow); }
    text { fill: var(--text); font: 14px sans-serif; text-anchor: middle; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker></defs>

  <rect class="node" x="15" y="20" width="170" height="50" rx="8"/><text x="100" y="50">Tool pointers</text>
  <rect class="node" x="215" y="20" width="170" height="50" rx="8"/><text x="300" y="50">CSharpStyleChecker</text>
  <rect class="node" x="415" y="20" width="170" height="50" rx="8"/><text x="500" y="50">ExitPointGaps</text>
  <rect class="node" x="615" y="20" width="170" height="50" rx="8"/><text x="700" y="50">ReqTrace</text>

  <rect class="node" x="15" y="150" width="170" height="50" rx="8"/><text x="100" y="180">Workflow kit</text>
  <rect class="node" x="315" y="150" width="170" height="50" rx="8"/><text x="400" y="180">ExitPoints</text>
  <rect class="node" x="525" y="150" width="190" height="50" rx="8"/><text x="620" y="180">InvariantStringHelper</text>

  <line class="edge" x1="100" y1="70" x2="100" y2="148"/>
  <line class="edge" x1="300" y1="70" x2="370" y2="148"/>
  <line class="edge" x1="480" y1="70" x2="430" y2="148"/>
  <line class="edge" x1="520" y1="70" x2="590" y2="148"/>
  <line class="edge" x1="700" y1="70" x2="660" y2="148"/>
</svg>
